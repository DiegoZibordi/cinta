<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
 <script>window.onerror=function(m,s,l){var p=document.getElementById("log");if(p)p.textContent+="ERRO: "+m+" (linha "+l+")\n"};document.addEventListener("click",function(e){var p=document.getElementById("log");if(p)p.textContent+="toque em "+(e.target.id||e.target.tagName)+"\n"});</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinta ao vivo — teste de conexão</title>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#14262b;--mut:#5d7178;--line:#d5dfe2;--acc:#0f5c6e;--ok:#2e9e5b;--bad:#d9473f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--card:#162429;--ink:#e6eef0;--mut:#93a8af;--line:#2a3d44;--acc:#5cc3d6}}
:root[data-theme="dark"]{--bg:#0e1a1e;--card:#162429;--ink:#e6eef0;--mut:#93a8af;--line:#2a3d44;--acc:#5cc3d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
p{margin:0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
#bpm{font-size:88px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#bpm small{font-size:20px;font-weight:600;color:var(--mut);margin-left:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut);margin-right:6px}
.dot.on{background:var(--ok)}.dot.err{background:var(--bad)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.g b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.g span{font-size:12px;color:var(--mut)}
button{width:100%;font:700 17px system-ui,sans-serif;padding:14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;margin-top:12px}
canvas{width:100%;height:130px;display:block;margin-top:12px}
#msg{margin-top:10px;font-size:14px;color:var(--mut)}
</style></head><body><main>
<h1>Cinta ao vivo</h1><p>Teste de conexão da Polar H10 via Bluetooth.</p>
<div class="card">
 <div><span class="dot" id="dot"></span><span id="st">Desconectado</span></div>
 <div id="bpm">--<small>bpm</small></div>
 <div class="g"><div><b id="rr">--</b><span>RR (ms)</span></div><div><b id="mn">--</b><span>mín</span></div><div><b id="mx">--</b><span>máx</span></div></div>
 <canvas id="cv" width="600" height="260"></canvas>
 <button id="bt">Conectar cinta</button>
 <button id="bt2" style="background:none;color:var(--acc)">Não achou? Mostrar todos os dispositivos</button>
 <pre id="log" style="margin:12px 0 0;max-height:170px;overflow:auto;font-size:12px;white-space:pre-wrap;color:var(--mut)"></pre>
 <div id="msg">Molhe os eletrodos da cinta, vista-a e feche o app VO2 Master e outros apps que usem a cinta antes de conectar.</div>
 <div id="lk" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)"><b style="color:var(--ink)">Endereço direto desta página</b><div id="lku" style="word-break:break-all;margin:6px 0"></div><a id="lko" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700">Abrir fora do Claude</a> &nbsp;·&nbsp; <a id="lkc" href="#" style="color:var(--acc);font-weight:700">Copiar endereço</a></div>
</div>
<script>
const $=id=>document.getElementById(id);
let dev=null,hist=[],mn=null,mx=null;
function set(t,c){$("st").textContent=t;$("dot").className="dot "+(c||"")}
function say(t){$("msg").textContent=t}
function draw(){const c=$("cv"),x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement);
 const d=hist.slice(-120);if(d.length<2)return;
 const lo=Math.min(...d)-5,hi=Math.max(...d)+5;
 x.strokeStyle=cs.getPropertyValue("--acc").trim()||"#0f5c6e";x.lineWidth=3;x.lineJoin="round";x.beginPath();
 d.forEach((v,i)=>{const px=i/(120-1)*W+(W-(d.length-1)/(120-1)*W),py=H-(v-lo)/(hi-lo)*H;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function onData(e){const v=e.target.value,fl=v.getUint8(0);let i=1,hr;
 if(fl&1){hr=v.getUint16(i,true);i+=2}else{hr=v.getUint8(i);i+=1}
 if(fl&8)i+=2;
 let rr=null;if(fl&16){while(i+1<v.byteLength){rr=Math.round(v.getUint16(i,true)/1024*1000);i+=2}}
 $("bpm").firstChild.nodeValue=hr;if(rr!==null)$("rr").textContent=rr;
 mn=mn===null?hr:Math.min(mn,hr);mx=mx===null?hr:Math.max(mx,hr);$("mn").textContent=mn;$("mx").textContent=mx;
 hist.push(hr);if(hist.length>600)hist.shift();draw()}
const log=t=>{const p=$("log");p.textContent+=new Date().toLocaleTimeString("pt-BR")+"  "+t+"\n";p.scrollTop=p.scrollHeight};
